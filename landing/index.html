<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171721" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or system) theme before first paint so there is no light flash in dark mode
      try {
        var saved = localStorage.getItem("eek-theme");
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="eek is a personal assistant that lives in Telegram. Set reminders, draft and send email, browse the web, and use its own Linux computer — all by chatting."
    />
    <link rel="icon" type="image/svg+xml" href="/landing/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eek" />
    <meta property="og:title" content="eek — your life, handled one message at a time" />
    <meta
      property="og:description"
      content="Reminders, email that waits for your confirmation, web browsing, and a Linux computer — in a single Telegram conversation."
    />
    <meta property="og:image" content="/landing/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="eek — your life, handled one message at a time" />
    <meta
      name="twitter:description"
      content="Reminders, email that waits for your confirmation, web browsing, and a Linux computer — in a single Telegram conversation."
    />
    <meta name="twitter:image" content="/landing/og.png" />

    <title>eek — a personal assistant that lives in Telegram</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
